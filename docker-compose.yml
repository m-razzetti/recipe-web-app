services:

  backend:
    build: ./backend
    container_name: recipes-backend
    ports:
      - "9001:8000"
    environment:
      DROPBOX_APP_KEY: rqzwq45lzaaxi68
      DROPBOX_APP_SECRET: 3ox1aph7nqhfbno
      DROPBOX_REFRESH_TOKEN: DzLdclXX7OMAAAAAAAAAAZdMpbZuaM-tRb1lcsqupNWNe-gpuAqOkbZY1e-qvDE4

      # 🔐 NEW AUTH VARIABLES
      APP_USERNAME: mrazz
      APP_PASSWORD: mikerazz
      SESSION_SECRET: dd2aa90ead80896c45904d9cd5edf32d95c230c284dc7d4719faf7b4f138a23d
      DISABLE_AUTH: "false"
      OPENAI_OCR_MODEL: gpt-4.1-mini
      OPENAI_RECIPE_MODEL: gpt-4.1-mini
      OPENAI_TIMEOUT_SEC: "30"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: recipes-frontend
    ports:
      - "9002:80"
    restart: unless-stopped

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: recipes-npm
    restart: unless-stopped
    ports:
      - "443:443"
      - "8081:81"
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: recipes-cloudflared
    restart: unless-stopped
    profiles:
      - cloudflare
    command: tunnel --no-autoupdate run
    environment:
      # Create a named tunnel in Cloudflare, then paste its token into .env.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
