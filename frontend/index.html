<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipes</title>
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recipes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/razz.png">
<link rel="apple-touch-startup-image" href="/razz.png">

<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/modal.css">
<link rel="stylesheet" href="/css/print.css">
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/page.css">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
<div id="app-splash" class="app-splash">
  <div class="app-splash-inner">
    <img src="/razz.png" alt="" class="app-splash-logo">
    <div class="app-splash-title">Recipe Library</div>
  </div>
</div>

<div class="app">

  <!-- MOBILE TOPBAR -->
  <div class="mobile-topbar app-header">
    <button class="mobile-menu-btn app-header-btn" onclick="openMobileSidebar()" aria-label="Open tags">☰</button>
    <div class="mobile-title app-title">Recipes</div>
    <button class="app-header-btn" onclick="openImport()" aria-label="Add recipe">＋</button>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <img src="/razz.png" alt="Recipe Library" class="sidebar-logo">

    <input id="search" placeholder="Search">

    <h4>TAGS</h4>
    <div id="tag-list"></div>

    <button class="import-btn" onclick="openImport()">+ Import Recipe</button>
  </div>

  <!-- MOBILE OVERLAY (click to close) -->
  <div class="mobile-overlay" onclick="closeMobileSidebar()"></div>

  <!-- MAIN -->
  <div class="main">

    <div id="grid-controls">
      <button id="btn-select" onclick="toggleSelectionMode()">Select</button>
      <button onclick="setGrid()" id="btn-grid">Grid</button>
      <button onclick="setList()" id="btn-list">List</button>
    </div>

    <div id="bulk-toolbar" class="bulk-toolbar hidden">
      <span id="bulk-count">0 selected</span>
      <button onclick="selectAllVisible()">Select Visible</button>
      <button onclick="bulkAddTags()">Add Tags</button>
      <button class="danger" onclick="bulkDeleteRecipes()">Delete</button>
      <button onclick="clearSelection()">Clear</button>
    </div>

    <div id="recipe-grid"></div>

    <div id="recipe-detail" class="hidden"></div>

  </div>
</div>

<nav class="mobile-bottom-nav" aria-label="Primary">
  <button id="tab-recipes" class="is-active" onclick="activateMobileTab('recipes')">
    <span>Library</span>
  </button>
  <button id="tab-search" onclick="activateMobileTab('search')">
    <span>Search</span>
  </button>
  <button id="tab-tags" onclick="activateMobileTab('tags')">
    <span>Tags</span>
  </button>
  <button id="tab-add" onclick="activateMobileTab('add')">
    <span>Add</span>
  </button>
</nav>

<!-- MODAL -->
<div id="modal" class="hidden">
  <div class="modal-content">
    <h3 id="modal-title">Edit Recipe</h3>

    <input id="recipe-name" placeholder="Recipe Name">
    <input id="recipe-original-name" type="hidden" value="">
    <input id="recipe-tags" placeholder="tags separated by space">
    <div id="tag-suggestions" class="tag-suggestions hidden"></div>
    <textarea id="recipe-markdown" rows="15"></textarea>
    <label for="source-input" style="font-size:12px; color:#475569;">Recipe source (.txt/.md/.pdf, auto-convert to markdown)</label>
    <input type="file" id="source-input" accept=".txt,.md,.pdf,text/plain,text/markdown,application/pdf">
    <label for="photo-input" style="font-size:12px; color:#475569;">Photo (optional)</label>
    <input type="file" id="photo-input" accept="image/*">

    <div style="display:flex; justify-content:flex-end; gap:10px;">
      <button onclick="closeModal()">Cancel</button>
      <button onclick="saveRecipe()">Save</button>
    </div>
  </div>
</div>

<div id="loading-overlay" class="loading-overlay" aria-live="polite" aria-busy="true">
  <div class="loading-box">
    <div class="loading-spinner"></div>
    <div id="loading-text">Loading...</div>
  </div>
</div>

<div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

<script>
const API = "/api";
const DEFAULT_RECIPE_IMAGE = "/razz.png";
const RECIPE_PAGE_SIZE = 60;
let allRecipes = [];
let currentRecipe = null;
let selectionMode = false;
let selectedRecipes = new Set();
let visibleRecipes = [];
let tagPopularity = new Map();
let pendingRequests = 0;
let loadingTimer = null;
let loadingShownAt = 0;
let splashDismissed = false;

async function api(url, options={}) {
  const { skipLoading, loadingMessage, ...fetchOptions } = options;
  fetchOptions.credentials = "include";

  if (!skipLoading) beginLoading(loadingMessage || "Loading...");
  try {
    return await fetch(url, fetchOptions);
  } finally {
    if (!skipLoading) endLoading();
  }
}

function beginLoading(message) {
  pendingRequests += 1;
  const overlay = document.getElementById("loading-overlay");
  const text = document.getElementById("loading-text");
  text.textContent = message || "Loading...";

  if (pendingRequests > 1) return;

  if (loadingTimer) clearTimeout(loadingTimer);
  loadingTimer = setTimeout(() => {
    overlay.classList.add("visible");
    document.body.style.cursor = "progress";
    loadingShownAt = Date.now();
    loadingTimer = null;
  }, 140);
}

function endLoading() {
  pendingRequests = Math.max(0, pendingRequests - 1);
  if (pendingRequests > 0) return;

  if (loadingTimer) {
    clearTimeout(loadingTimer);
    loadingTimer = null;
    return;
  }

  const overlay = document.getElementById("loading-overlay");
  const minVisibleMs = 220;
  const elapsed = Date.now() - loadingShownAt;
  const hide = () => {
    overlay.classList.remove("visible");
    document.body.style.cursor = "";
  };

  if (elapsed < minVisibleMs) {
    setTimeout(hide, minVisibleMs - elapsed);
  } else {
    hide();
  }
}

function recipeImageSrc(name, cover, thumb = false) {
  if (!cover) return DEFAULT_RECIPE_IMAGE;
  const query = thumb ? "?thumb=1" : "";
  return `/api/photos/${encodeURIComponent(name)}/${cover}${query}`;
}

function clearSearch() {
  const search = document.getElementById("search");
  search.value = "";
  renderFromSearch();
}

function updateBulkToolbar() {
  const toolbar = document.getElementById("bulk-toolbar");
  const count = selectedRecipes.size;
  document.getElementById("bulk-count").textContent = `${count} selected`;
  toolbar.classList.toggle("hidden", !selectionMode);
  document.getElementById("btn-select").classList.toggle("active", selectionMode);
  document.body.classList.toggle("selection-mode", selectionMode);
}

function toggleSelectionMode(force) {
  const next = typeof force === "boolean" ? force : !selectionMode;
  selectionMode = next;
  if (!selectionMode) selectedRecipes.clear();
  updateBulkToolbar();
  renderFromSearch();
}

function clearSelection() {
  selectedRecipes.clear();
  updateBulkToolbar();
  renderFromSearch();
}

function toggleRecipeSelection(name) {
  if (selectedRecipes.has(name)) selectedRecipes.delete(name);
  else selectedRecipes.add(name);
  updateBulkToolbar();
  renderFromSearch();
}

function selectAllVisible() {
  visibleRecipes.forEach(r => selectedRecipes.add(r.name));
  updateBulkToolbar();
  renderFromSearch();
}

async function bulkAddTags() {
  if (!selectedRecipes.size) {
    showToast("Select at least one recipe", "error");
    return;
  }
  const tags = prompt("Add tags (space or comma separated):");
  if (!tags || !tags.trim()) return;

  const res = await api(`${API}/recipes/bulk-tags`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ names: [...selectedRecipes], tags }),
    loadingMessage: "Adding tags..."
  });
  if (!res.ok) {
    showToast("Bulk tag update failed", "error");
    return;
  }
  await loadRecipes();
  toggleSelectionMode(false);
  showToast("Tags updated", "success");
}

async function bulkDeleteRecipes() {
  if (!selectedRecipes.size) {
    showToast("Select at least one recipe", "error");
    return;
  }
  if (!confirm(`Delete ${selectedRecipes.size} recipes?`)) return;

  const res = await api(`${API}/recipes/bulk-delete`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ names: [...selectedRecipes] }),
    loadingMessage: "Deleting recipes..."
  });
  if (!res.ok) {
    showToast("Bulk delete failed", "error");
    return;
  }
  await loadRecipes();
  toggleSelectionMode(false);
  goBack();
  showToast("Recipes deleted", "success");
}

function showToast(message, type = "info") {
  const root = document.getElementById("toast-root");
  const toast = document.createElement("div");
  toast.className = `toast toast-${type}`;
  toast.textContent = message;
  root.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add("visible"));
  setTimeout(() => {
    toast.classList.remove("visible");
    setTimeout(() => toast.remove(), 180);
  }, 2400);
}

function bindTap(element, handler) {
  if ("PointerEvent" in window) {
    element.addEventListener("pointerup", (event) => {
      // Ignore right/middle clicks on desktop pointer devices.
      if (event.button && event.button !== 0) return;
      handler(event);
    });
    return;
  }

  element.addEventListener("click", (event) => {
    handler(event);
  });
}

function triggerHaptic() {
  if ("vibrate" in navigator) {
    navigator.vibrate(8);
  }
}

function hideSplash() {
  if (splashDismissed) return;
  splashDismissed = true;
  const splash = document.getElementById("app-splash");
  splash.classList.add("hidden-out");
  setTimeout(() => splash.remove(), 400);
}

function setupHapticFeedback() {
  const resolveTapTarget = (event) => {
    const raw = event.target;
    const el = raw instanceof Element ? raw : raw?.parentElement;
    if (!el) return null;
    return el.closest("button, .recipe-card, .tag-item span, .tag-delete");
  };

  document.addEventListener("pointerdown", (event) => {
    const target = resolveTapTarget(event);
    if (!target) return;
    target.classList.add("tap-press");
  });

  document.addEventListener("pointerup", (event) => {
    const target = resolveTapTarget(event);
    if (!target) return;
    target.classList.remove("tap-press");
  });

  document.addEventListener("click", (event) => {
    const target = resolveTapTarget(event);
    if (!target) return;
    triggerHaptic();
  });
}

function setActiveTab(tab) {
  ["recipes", "search", "tags", "add"].forEach(name => {
    const el = document.getElementById(`tab-${name}`);
    if (el) el.classList.toggle("is-active", name === tab);
  });
}

function activateMobileTab(tab) {
  if (tab === "add") {
    openImport();
    setActiveTab("add");
    return;
  }
  if (tab === "tags") {
    openMobileSidebar();
    setActiveTab("tags");
    return;
  }
  if (tab === "search") {
    goBack();
    setActiveTab("search");
    const search = document.getElementById("search");
    search.focus();
    search.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  goBack();
  setActiveTab("recipes");
}

/* =========================
   MOBILE SIDEBAR
========================= */

function openMobileSidebar() {
  document.body.classList.add("mobile-sidebar-open");
}

function closeMobileSidebar() {
  document.body.classList.remove("mobile-sidebar-open");
  if (document.getElementById("tab-tags")?.classList.contains("is-active")) {
    setActiveTab("recipes");
  }
}

/* Close sidebar after selecting a tag on mobile */
function closeSidebarIfMobile() {
  if (window.matchMedia("(max-width: 768px)").matches) {
    closeMobileSidebar();
  }
}

async function loadRecipes() {
  showRecipeSkeleton();
  const firstPage = await fetchRecipePage(0, true);
  if (!firstPage) {
    showToast("Could not load recipes", "error");
    hideSplash();
    return;
  }

  allRecipes = firstPage.items;
  rebuildTagPopularity();
  renderFromSearch();
  renderTags();

  if (firstPage.nextOffset !== null) {
    loadRemainingRecipePages(firstPage.nextOffset);
  }
  hideSplash();
}

async function fetchRecipePage(offset, skipLoading = true) {
  const res = await api(`${API}/recipes?offset=${offset}&limit=${RECIPE_PAGE_SIZE}`, { skipLoading });
  if (!res.ok) return null;

  const items = await res.json();
  const nextOffsetHeader = res.headers.get("X-Next-Offset");
  const nextOffset = nextOffsetHeader === null || nextOffsetHeader === ""
    ? null
    : Number(nextOffsetHeader);
  return { items, nextOffset };
}

function showRecipeSkeleton(count = 8) {
  document.getElementById("recipe-detail").classList.add("hidden");
  document.getElementById("grid-controls").style.display = "flex";
  const grid = document.getElementById("recipe-grid");
  grid.classList.remove("hidden");
  grid.classList.add("grid-mode");
  grid.classList.remove("list-mode");
  grid.innerHTML = "";
  for (let i = 0; i < count; i += 1) {
    const card = document.createElement("div");
    card.className = "recipe-card skeleton-card";
    card.innerHTML = `
      <div class="skeleton skeleton-image"></div>
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line short"></div>
    `;
    grid.appendChild(card);
  }
}

function mergeRecipes(items) {
  const byName = new Map(allRecipes.map(r => [r.name, r]));
  items.forEach(item => byName.set(item.name, item));
  allRecipes = Array.from(byName.values()).sort((a, b) => a.name.localeCompare(b.name));
  rebuildTagPopularity();
}

function rebuildTagPopularity() {
  const counts = new Map();
  allRecipes.forEach((recipe) => {
    (recipe.tags || []).forEach((tag) => {
      counts.set(tag, (counts.get(tag) || 0) + 1);
    });
  });
  tagPopularity = counts;
}

function getTagInputState(rawValue) {
  const endsWithSeparator = /[\s,]$/.test(rawValue);
  const tokens = rawValue
    .split(/[,\s]+/)
    .map((t) => t.trim().toLowerCase())
    .filter(Boolean);
  if (endsWithSeparator) {
    return { currentToken: "", existingTokens: tokens };
  }
  const currentToken = tokens.pop() || "";
  return { currentToken, existingTokens: tokens };
}

function hideTagSuggestions() {
  const box = document.getElementById("tag-suggestions");
  box.innerHTML = "";
  box.classList.add("hidden");
}

function applyTagSuggestion(tag) {
  const input = document.getElementById("recipe-tags");
  const raw = input.value;
  const nextTag = `${tag} `;
  if (/[\s,]$/.test(raw) || raw.length === 0) {
    input.value = `${raw}${nextTag}`;
  } else {
    input.value = raw.replace(/[^\s,]*$/, nextTag);
  }
  input.focus();
  renderTagSuggestions();
}

function renderTagSuggestions() {
  const box = document.getElementById("tag-suggestions");
  const input = document.getElementById("recipe-tags");
  const raw = input.value.trimEnd();
  const { currentToken, existingTokens } = getTagInputState(raw);
  const existing = new Set(existingTokens);

  const candidates = [...tagPopularity.entries()]
    .filter(([tag]) => !existing.has(tag))
    .filter(([tag]) => !currentToken || tag.startsWith(currentToken))
    .sort((a, b) => (b[1] - a[1]) || a[0].localeCompare(b[0]))
    .slice(0, 7);

  if (!candidates.length) {
    hideTagSuggestions();
    return;
  }

  box.innerHTML = "";
  candidates.forEach(([tag, count]) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tag-suggestion-item";
    btn.innerHTML = `<span>${tag}</span><span class="tag-suggestion-count">${count}</span>`;
    btn.onclick = () => applyTagSuggestion(tag);
    box.appendChild(btn);
  });
  box.classList.remove("hidden");
}

async function loadRemainingRecipePages(startOffset) {
  let nextOffset = startOffset;
  while (nextOffset !== null) {
    const page = await fetchRecipePage(nextOffset, true);
    if (!page) return;
    mergeRecipes(page.items);
    renderTags();
    if (document.getElementById("recipe-detail").classList.contains("hidden")) {
      renderFromSearch();
    }
    nextOffset = page.nextOffset;
  }
}

function renderFromSearch() {
  const q = document.getElementById("search").value.toLowerCase();
  renderRecipes(allRecipes.filter(r => r.name.toLowerCase().includes(q)));
}

function renderRecipes(recipes) {
  visibleRecipes = recipes;
  document.getElementById("recipe-detail").classList.add("hidden");
  document.getElementById("grid-controls").style.display = "flex";
  document.getElementById("recipe-grid").classList.remove("hidden");

  const grid = document.getElementById("recipe-grid");
  grid.innerHTML = "";

  if (!recipes.length) {
    const hasLibrary = allRecipes.length > 0;
    grid.innerHTML = hasLibrary
      ? `
        <div class="empty-state">
          <h3>No matching recipes</h3>
          <p>Try a different search or clear your filters.</p>
          <div class="empty-actions">
            <button class="primary" onclick="clearSearch()">Clear Search</button>
            <button onclick="renderRecipes(allRecipes)">Show All</button>
          </div>
        </div>
      `
      : `
        <div class="empty-state">
          <h3>No recipes yet</h3>
          <p>Import your first recipe to start your library.</p>
          <div class="empty-actions">
            <button class="primary" onclick="openImport()">+ Import Recipe</button>
          </div>
        </div>
      `;
    return;
  }

  recipes.forEach(r => {
    const card = document.createElement("div");
    const selected = selectedRecipes.has(r.name);
    card.className = `recipe-card ${selectionMode ? "selectable" : ""} ${selected ? "is-selected" : ""}`;
    const isFallback = !r.cover;
    const chips = (r.tags || []).slice(0, 3).map(t => `<span class="tag-chip">${t}</span>`).join("");
    const extraTagCount = (r.tags || []).length - 3;

    card.innerHTML = `
      ${selectionMode ? `<div class="select-indicator">${selected ? "✓" : ""}</div>` : ""}
      <img class="${isFallback ? "is-fallback" : ""}" src="${recipeImageSrc(r.name, r.cover, true)}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='${DEFAULT_RECIPE_IMAGE}';this.classList.add('is-fallback')">
      <div class="recipe-title">${r.name}</div>
      <div class="recipe-card-meta">
        ${chips}
        ${extraTagCount > 0 ? `<span class="tag-chip">+${extraTagCount}</span>` : ""}
      </div>
    `;

    card.onclick = () => {
      if (selectionMode) {
        toggleRecipeSelection(r.name);
      } else {
        openRecipe(r.name);
      }
    };
    grid.appendChild(card);
  });
}

function renderTags() {
  const tagList = document.getElementById("tag-list");
  tagList.innerHTML = "";

  const tags = new Set();
  allRecipes.forEach(r => r.tags.forEach(t => tags.add(t)));

  const allBtn = document.createElement("button");
  allBtn.type = "button";
  allBtn.className = "tag-link-btn";
  allBtn.textContent = "All Recipes";
  bindTap(allBtn, () => {
    renderFromSearch();
    closeSidebarIfMobile();
  });
  tagList.appendChild(allBtn);

  [...tags].sort().forEach(tag => {
    const div = document.createElement("div");
    div.className = "tag-item";
    const name = document.createElement("button");
    name.type = "button";
    name.className = "tag-link-btn";
    name.textContent = tag;
    bindTap(name, () => filterTag(tag));

    const del = document.createElement("button");
    del.type = "button";
    del.className = "tag-delete";
    del.textContent = "🗑";
    bindTap(del, (e) => {
      e.stopPropagation();
      deleteTag(tag);
    });

    div.appendChild(name);
    div.appendChild(del);
    tagList.appendChild(div);
  });
}

function filterTag(tag) {
  renderRecipes(allRecipes.filter(r => r.tags.includes(tag)));
  closeSidebarIfMobile();
}

async function openRecipe(name) {
  if (selectionMode) return;
  currentRecipe = name;
  setActiveTab("recipes");
  closeSidebarIfMobile();

  const res = await api(`${API}/recipes/${encodeURIComponent(name)}`);
  if (!res.ok) {
    showToast("Could not open recipe", "error");
    return;
  }

  let md = await res.text();

  // Remove Tags line
  md = md.replace(/^Tags:.*\n+/m, "");

  // Remove first markdown heading so title isn't duplicated
  md = md.replace(/^#+\s+.*\n?/, "");

  const recipe = allRecipes.find(r => r.name === name);
  const html = marked.parse(md);

  document.getElementById("grid-controls").style.display = "none";
  document.getElementById("recipe-grid").classList.add("hidden");
  document.getElementById("recipe-detail").classList.remove("hidden");

  document.getElementById("recipe-detail").innerHTML = `
    <div class="detail-sticky">
      <button class="back-btn" onclick="goBack()">← Back</button>
      <div class="detail-sticky-title">${name}</div>
      <button onclick="printRecipe()">🖨️</button>
    </div>

    <div class="detail-header">
      <h1>${name}</h1>
      <div class="detail-icons">
        <button id="detail-edit-btn">✏️</button>
        <button id="detail-delete-btn">🗑️</button>
      </div>
    </div>

    <div class="detail-body">
      <div class="detail-image-wrap">
        <img class="detail-image ${recipe?.cover ? "" : "is-fallback"}" src="${recipeImageSrc(name, recipe?.cover)}" onerror="this.onerror=null;this.src='${DEFAULT_RECIPE_IMAGE}';this.classList.add('is-fallback')">
        ${recipe?.cover ? `<button class="detail-image-delete" title="Delete image" onclick='deleteRecipeImage(${JSON.stringify(name)}, ${JSON.stringify(recipe.cover)})'>🗑️</button>` : ""}
      </div>
      <div class="markdown-content">${html}</div>
    </div>
  `;

  wrapInstructionsSection();
  document.getElementById("detail-edit-btn").onclick = () => editRecipe(name);
  document.getElementById("detail-delete-btn").onclick = () => deleteRecipe(name);
}

function goBack() {
  currentRecipe = null;
  setActiveTab("recipes");
  renderRecipes(allRecipes);
}

function setGrid(){
  const grid = document.getElementById("recipe-grid");
  grid.classList.remove("list-mode");
  grid.classList.add("grid-mode");

  document.getElementById("btn-grid").classList.add("active");
  document.getElementById("btn-list").classList.remove("active");
}

function setList(){
  const grid = document.getElementById("recipe-grid");
  grid.classList.remove("grid-mode");
  grid.classList.add("list-mode");

  document.getElementById("btn-list").classList.add("active");
  document.getElementById("btn-grid").classList.remove("active");
}

async function editRecipe(name) {
  const res = await api(`${API}/recipes/${encodeURIComponent(name)}`);
  if (!res.ok) {
    showToast("Could not open editor", "error");
    return;
  }
  const md = await res.text();
  const recipe = allRecipes.find(r => r.name === name);

  document.getElementById("modal-title").textContent = "Edit Recipe";
  document.getElementById("recipe-original-name").value = name;
  document.getElementById("recipe-name").value = name;
  document.getElementById("recipe-tags").value = (recipe?.tags || []).join(" ");
  renderTagSuggestions();
  document.getElementById("recipe-markdown").value = md.replace(/^Tags:.*\n+/m, "");
  document.getElementById("modal").classList.remove("hidden");
}

async function saveRecipe() {
  const name = document.getElementById("recipe-name").value.trim();
  const originalName = document.getElementById("recipe-original-name").value.trim();
  const markdown = document.getElementById("recipe-markdown").value;
  const tags = document.getElementById("recipe-tags").value.trim();
  const photo = document.getElementById("photo-input").files[0];

  if (!name || !markdown) {
    showToast("Name and markdown required", "error");
    return;
  }

  const form = new FormData();
  form.append("name", name);
  form.append("markdown", markdown);
  form.append("tags", tags);
  if (originalName) form.append("original_name", originalName);
  if (photo) form.append("photo", photo);

  const res = await api(`${API}/recipes`, {
    method:"POST",
    body:form,
    loadingMessage: "Saving recipe..."
  });
  if (!res.ok) { showToast("Save failed", "error"); return; }

  document.getElementById("recipe-original-name").value = "";
  closeModal();
  await loadRecipes();
  openRecipe(name);
  showToast("Recipe saved", "success");
}

async function deleteRecipe(name) {
  if (!confirm("Delete recipe?")) return;
  const res = await api(`${API}/recipes/${encodeURIComponent(name)}`, {
    method:"DELETE",
    loadingMessage: "Deleting recipe..."
  });
  if (!res.ok) {
    showToast("Delete failed", "error");
    return;
  }
  goBack();
  loadRecipes();
  showToast("Recipe deleted", "success");
}

async function deleteRecipeImage(name, filename) {
  if (!confirm("Delete this recipe image?")) return;
  const res = await api(`${API}/recipes/${encodeURIComponent(name)}/photo/${encodeURIComponent(filename)}`, {
    method:"DELETE",
    loadingMessage: "Deleting image..."
  });
  if (!res.ok) {
    showToast("Delete image failed", "error");
    return;
  }
  await loadRecipes();
  openRecipe(name);
  showToast("Image deleted", "success");
}

async function deleteTag(tag) {
  if (!confirm("Delete tag everywhere?")) return;
  const res = await api(`${API}/tags/${encodeURIComponent(tag)}`, {
    method:"DELETE",
    loadingMessage: "Updating tags..."
  });
  if (!res.ok) {
    showToast("Tag update failed", "error");
    return;
  }
  await loadRecipes();
  showToast("Tag removed", "success");
}

function openImport() {
  setActiveTab("add");
  document.getElementById("recipe-original-name").value = "";
  document.getElementById("modal-title").textContent = "Import Recipe";
  document.getElementById("recipe-name").value="";
  document.getElementById("recipe-tags").value="";
  renderTagSuggestions();
  document.getElementById("recipe-markdown").value="";
  document.getElementById("source-input").value="";
  document.getElementById("photo-input").value="";
  document.getElementById("modal").classList.remove("hidden");
}

function closeModal() {
  setActiveTab("recipes");
  document.getElementById("recipe-original-name").value = "";
  document.getElementById("modal").classList.add("hidden");
  document.getElementById("source-input").value = "";
  hideTagSuggestions();
}

async function importSourceFile(file) {
  if (!file) return;

  const form = new FormData();
  form.append("source_file", file);

  const res = await api(`${API}/import/convert`, {
    method: "POST",
    body: form,
    loadingMessage: "Converting file..."
  });

  if (!res.ok) {
    let message = "File conversion failed";
    try {
      const payload = await res.json();
      if (payload?.detail) message = payload.detail;
    } catch (_) {}
    showToast(message, "error");
    return;
  }

  const payload = await res.json();
  const nameInput = document.getElementById("recipe-name");
  const markdownInput = document.getElementById("recipe-markdown");
  const existingName = nameInput.value.trim();

  if (!existingName && payload.name) {
    nameInput.value = payload.name;
  }
  markdownInput.value = payload.markdown || "";
  showToast("File converted to markdown", "success");
}

function logout() {
  api(`${API}/logout`, {method:"POST"}).then(()=>location.reload());
}

function wrapInstructionsSection() {
  const markdown = document.querySelector("#recipe-detail .markdown-content");
  if (!markdown) return;
  if (markdown.querySelector(".instructions-section")) return;

  const children = [...markdown.children];
  let startIndex = -1;

  for (let i = 0; i < children.length; i += 1) {
    const el = children[i];
    if (!/^H[23]$/.test(el.tagName)) continue;
    const title = (el.textContent || "").trim().toLowerCase();
    if (title === "instructions" || title === "directions") {
      startIndex = i;
      break;
    }
  }
  if (startIndex === -1) return;

  const section = document.createElement("div");
  section.className = "instructions-section";
  const startNode = children[startIndex];
  markdown.insertBefore(section, startNode);

  let idx = startIndex;
  while (idx < children.length) {
    const node = children[idx];
    if (idx > startIndex && /^H2$/.test(node.tagName)) break;
    section.appendChild(node);
    idx += 1;
  }
}

function printRecipe() {
  computePrintScale();
  window.print();
}

function computePrintScale() {
  const detail = document.getElementById("recipe-detail");
  if (!detail || detail.classList.contains("hidden")) return;
  buildStructuredPrintLayout(detail);
}

function resetPrintScale() {
  const detail = document.getElementById("recipe-detail");
  if (!detail) return;
  const structured = detail.querySelector(".print-structured");
  if (structured) structured.remove();
  detail.classList.remove("print-layout-ready");
}

function buildStructuredPrintLayout(detail) {
  const old = detail.querySelector(".print-structured");
  if (old) old.remove();

  const titleEl = detail.querySelector(".detail-header h1");
  const markdown = detail.querySelector(".markdown-content");
  if (!titleEl || !markdown) return;

  const allNodes = [...markdown.children];
  if (!allNodes.length) return;

  const isStepsHeading = (text) => {
    const t = (text || "").trim().toLowerCase().replace(/[:\s]+$/g, "");
    return t === "steps" || t === "step" || t === "instructions" || t === "directions" || t === "method";
  };

  let splitIndex = -1;
  for (let i = 0; i < allNodes.length; i += 1) {
    const node = allNodes[i];
    if (!/^H[23]$/.test(node.tagName)) continue;
    if (isStepsHeading(node.textContent)) {
      splitIndex = i;
      break;
    }
  }
  if (splitIndex === -1) splitIndex = allNodes.length;

  const topNodes = allNodes.slice(0, splitIndex);
  const stepsNodes = allNodes.slice(splitIndex);
  const printRoot = document.createElement("div");
  printRoot.className = "print-structured";

  const top = document.createElement("section");
  top.className = "print-top";
  const heading = document.createElement("h1");
  heading.textContent = titleEl.textContent.trim();
  top.appendChild(heading);

  const photo = detail.querySelector(".detail-image");
  if (photo && photo.getAttribute("src")) {
    const img = document.createElement("img");
    img.className = "print-top-photo";
    img.src = photo.getAttribute("src");
    img.alt = heading.textContent;
    top.appendChild(img);
  }

  const topContent = document.createElement("div");
  topContent.className = "print-top-content";
  topNodes.forEach((node) => topContent.appendChild(node.cloneNode(true)));
  top.appendChild(topContent);

  printRoot.appendChild(top);

  if (stepsNodes.length) {
    const bottom = document.createElement("section");
    bottom.className = "print-steps";
    const bottomTitle = document.createElement("h2");
    bottomTitle.textContent = /^H[23]$/.test(stepsNodes[0].tagName)
      ? (stepsNodes[0].textContent || "Steps").trim()
      : "Steps";
    bottom.appendChild(bottomTitle);

    const grid = document.createElement("div");
    grid.className = "print-steps-grid";
    const left = document.createElement("div");
    left.className = "print-steps-col";
    const right = document.createElement("div");
    right.className = "print-steps-col";

    const flowNodes = /^H[23]$/.test(stepsNodes[0].tagName) ? stepsNodes.slice(1) : stepsNodes;
    const getWeight = (node) => {
      const txt = (node.textContent || "").trim().length;
      if (node.tagName === "UL" || node.tagName === "OL") return txt + 80;
      if (node.tagName === "P") return txt + 24;
      if (/^H[23]$/.test(node.tagName)) return txt + 30;
      return txt + 16;
    };

    // Build step blocks so we split at whole-step boundaries.
    const blocks = [];
    let currentBlock = [];
    flowNodes.forEach((node) => {
      const startsNewBlock = /^H[23]$/.test(node.tagName) && currentBlock.length > 0;
      if (startsNewBlock) {
        blocks.push(currentBlock);
        currentBlock = [node];
      } else {
        currentBlock.push(node);
      }
    });
    if (currentBlock.length) blocks.push(currentBlock);

    const blockWeights = blocks.map((block) => block.reduce((sum, n) => sum + getWeight(n), 0));
    const totalWeight = blockWeights.reduce((sum, w) => sum + w, 0);
    let splitAt = blocks.length;

    if (blocks.length > 1) {
      // Find split closest to 50/50 while keeping both columns populated.
      let running = 0;
      let bestDiff = Number.POSITIVE_INFINITY;
      let bestIndex = 1;
      for (let i = 1; i < blocks.length; i += 1) {
        running += blockWeights[i - 1];
        const diff = Math.abs((totalWeight / 2) - running);
        if (diff < bestDiff) {
          bestDiff = diff;
          bestIndex = i;
        }
      }
      splitAt = bestIndex;
    }

    blocks.forEach((block, blockIndex) => {
      const wrapper = document.createElement("div");
      wrapper.className = "print-step-block";
      block.forEach((node) => wrapper.appendChild(node.cloneNode(true)));
      if (blockIndex < splitAt) {
        left.appendChild(wrapper);
      } else {
        right.appendChild(wrapper);
      }
    });

    grid.appendChild(left);
    grid.appendChild(right);
    bottom.appendChild(grid);
    printRoot.appendChild(bottom);
  }

  detail.appendChild(printRoot);
  detail.classList.add("print-layout-ready");
}

async function disableServiceWorkers() {
  if (!("serviceWorker" in navigator)) return;
  try {
    const registrations = await navigator.serviceWorker.getRegistrations();
    for (const registration of registrations) {
      await registration.unregister();
    }
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map((key) => caches.delete(key)));
    }
  } catch (err) {
    console.error("Service worker cleanup failed:", err);
  }
}

document.getElementById("search").addEventListener("input", e=>{
  setActiveTab("search");
  const q = e.target.value.toLowerCase();
  renderRecipes(allRecipes.filter(r => r.name.toLowerCase().includes(q)));
});

document.getElementById("recipe-tags").addEventListener("input", renderTagSuggestions);
document.getElementById("recipe-tags").addEventListener("focus", renderTagSuggestions);
document.getElementById("recipe-tags").addEventListener("blur", () => {
  setTimeout(hideTagSuggestions, 120);
});
document.getElementById("source-input").addEventListener("change", (e) => {
  const file = e.target.files && e.target.files[0];
  importSourceFile(file);
});

window.addEventListener("resize", () => {
  if (!window.matchMedia("(max-width: 768px)").matches) {
    closeMobileSidebar();
  }
});

window.addEventListener("beforeprint", computePrintScale);
window.addEventListener("afterprint", resetPrintScale);

setGrid();
updateBulkToolbar();
setupHapticFeedback();
disableServiceWorkers();
loadRecipes();
