<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipes</title>
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recipes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/razz.png">
<link rel="apple-touch-startup-image" href="/razz.png">

<link rel="stylesheet" href="/css/base.css?v=20260301">
<link rel="stylesheet" href="/css/layout.css?v=20260301">
<link rel="stylesheet" href="/css/components.css?v=20260301">
<link rel="stylesheet" href="/css/modal.css?v=20260301">
<link rel="stylesheet" href="/css/print.css?v=20260301">
<link rel="stylesheet" href="/css/mobile.css?v=20260301">
<link rel="stylesheet" href="/css/page.css?v=20260301">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
<div id="app-splash" class="app-splash">
  <div class="app-splash-inner">
    <img src="/razz.png" alt="" class="app-splash-logo">
    <div class="app-splash-title">Recipe Library</div>
  </div>
</div>

<div id="auth-overlay" class="auth-overlay hidden" aria-hidden="true">
  <form id="auth-form" class="auth-card" onsubmit="submitLogin(event)">
    <h2>Sign In</h2>
    <p>Enter your Recipe Library credentials.</p>
    <label for="login-username">Username</label>
    <input id="login-username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label for="login-password">Password</label>
    <input id="login-password" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <button id="login-submit" type="submit">Log In</button>
    <div id="login-error" class="login-error hidden" aria-live="polite"></div>
  </form>
</div>

<div class="app">

  <!-- MOBILE TOPBAR -->
  <div class="mobile-topbar app-header">
    <button class="mobile-menu-btn app-header-btn" onclick="openMobileSidebar()" aria-label="Open tags">☰</button>
    <input id="search-mobile" placeholder="Search recipes" aria-label="Search recipes">
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <img src="/razz.png" alt="Recipe Library" class="sidebar-logo">

    <input id="search" placeholder="Search">

    <h4>TAGS</h4>
    <div id="tag-list"></div>

    <h4>SHOPPING LIST</h4>
    <div id="shopping-status" class="shopping-status hidden" aria-live="polite"></div>
    <div class="shopping-list-input-row">
      <input id="shopping-item-input" placeholder="Add item">
      <button type="button" onclick="addShoppingItem()" aria-label="Add shopping item">+</button>
    </div>
    <div id="shopping-list-empty" class="shopping-list-empty">No items yet</div>
    <div id="shopping-list"></div>
    <button class="shopping-clear-btn" type="button" onclick="clearCheckedShoppingItems()">Clear Checked</button>

    <button class="import-btn" onclick="openImport()">+ Import Recipe</button>
    <button class="logout-btn" type="button" onclick="logout()">Log Out</button>
  </div>

  <!-- MOBILE OVERLAY (click to close) -->
  <div class="mobile-overlay" onclick="closeMobileSidebar()"></div>

  <!-- MAIN -->
  <div class="main">
    <div id="grid-controls">
      <button id="btn-select" onclick="toggleSelectionMode()">Select</button>
      <button onclick="setGrid()" id="btn-grid">Grid</button>
      <button onclick="setList()" id="btn-list">List</button>
      <button id="btn-view-mode" type="button" onclick="toggleViewMode()">Mobile View</button>
      <button id="btn-refresh" type="button" onclick="manualRefreshRecipes()">Refresh</button>
      <select id="sort-mode" aria-label="Sort recipes">
        <option value="alpha-asc">A to Z</option>
        <option value="alpha-desc">Z to A</option>
        <option value="date-desc">Date Added (Newest)</option>
        <option value="date-asc">Date Added (Oldest)</option>
      </select>
    </div>

    <div id="bulk-toolbar" class="bulk-toolbar hidden">
      <span id="bulk-count">0 selected</span>
      <button onclick="selectAllVisible()">Select Visible</button>
      <button onclick="openBulkTagModal()">Add Tags</button>
      <button class="danger" onclick="bulkDeleteRecipes()">Delete</button>
      <button onclick="clearSelection()">Clear</button>
    </div>

    <div id="recipe-grid"></div>

    <div id="recipe-detail" class="hidden"></div>

  </div>
</div>

<nav class="mobile-bottom-nav" aria-label="Primary">
  <button id="tab-recipes" class="is-active" onclick="activateMobileTab('recipes')">
    <span>Library</span>
  </button>
  <button id="tab-search" onclick="activateMobileTab('search')">
    <span>Search</span>
  </button>
  <button id="tab-tags" onclick="activateMobileTab('tags')">
    <span>Tags</span>
  </button>
  <button id="tab-add" onclick="activateMobileTab('add')">
    <span>Add</span>
  </button>
</nav>

<!-- MODAL -->
<div id="modal" class="hidden">
  <div class="modal-content">
    <h3 id="modal-title">Edit Recipe</h3>

    <input id="recipe-name" placeholder="Recipe Name">
    <input id="recipe-original-name" type="hidden" value="">
    <input id="recipe-tags" placeholder="tags separated by space">
    <div id="tag-suggestions" class="tag-suggestions hidden"></div>
    <textarea id="recipe-markdown" rows="15"></textarea>
    <label for="source-url" style="font-size:12px; color:#475569;">Social recipe URL (Instagram/TikTok)</label>
    <div style="display:flex; gap:8px; align-items:center;">
      <input id="source-url" type="url" placeholder="https://..." style="flex:1;">
      <button type="button" onclick="importFromUrl()">Import URL</button>
    </div>
    <label for="source-input" style="font-size:12px; color:#475569;">Recipe source (.txt/.md/.pdf/image, auto-convert to markdown with OCR)</label>
    <input type="file" id="source-input" accept=".txt,.md,.pdf,.jpg,.jpeg,.png,.webp,.heic,.heif,text/plain,text/markdown,application/pdf,image/*">
    <label for="photo-input" style="font-size:12px; color:#475569;">Photos (optional)</label>
    <input type="file" id="photo-input" accept="image/*" multiple>
    <div id="modal-image-manager" class="modal-image-manager hidden">
      <label for="title-image-select" style="font-size:12px; color:#475569;">Title image</label>
      <select id="title-image-select" onchange="setModalCoverFromSelect()"></select>
      <div id="modal-image-list" class="modal-image-list"></div>
    </div>

    <div class="modal-actions" style="display:flex; justify-content:flex-end; gap:10px;">
      <button onclick="closeModal()">Cancel</button>
      <button onclick="saveRecipe()">Save</button>
    </div>
  </div>
</div>

<div id="bulk-tag-modal" class="hidden">
  <div class="modal-content">
    <h3>Add Tags To Selected Recipes</h3>
    <input id="bulk-tags-input" placeholder="tags separated by space">
    <div id="bulk-tag-suggestions" class="tag-suggestions hidden"></div>
    <div class="modal-actions" style="display:flex; justify-content:flex-end; gap:10px;">
      <button onclick="closeBulkTagModal()">Cancel</button>
      <button onclick="submitBulkAddTags()">Add Tags</button>
    </div>
  </div>
</div>

<div id="loading-overlay" class="loading-overlay" aria-live="polite" aria-busy="true">
  <div class="loading-box">
    <div class="loading-spinner"></div>
    <div id="loading-text">Loading...</div>
  </div>
</div>

<div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

<div id="image-lightbox" class="image-lightbox hidden" aria-hidden="true" onclick="closeImageLightbox()">
  <div class="image-lightbox-inner" onclick="event.stopPropagation()">
    <button type="button" class="image-lightbox-close" aria-label="Close image" onclick="closeImageLightbox()">✕</button>
    <img id="image-lightbox-img" alt="Recipe image">
  </div>
</div>

<script>
const API = "/api";
const DEFAULT_RECIPE_IMAGE = "/razz.png";
const RECIPE_PAGE_SIZE = 60;
let allRecipes = [];
let currentRecipe = null;
let selectionMode = false;
let selectedRecipes = new Set();
let visibleRecipes = [];
let tagPopularity = new Map();
let pendingRequests = 0;
let loadingTimer = null;
let loadingShownAt = 0;
let splashDismissed = false;
let ingredientScaleNodes = [];
let recipeScaleFactor = 1;
let sortMode = "alpha-asc";
let modalImages = [];
let modalCover = "";
let shoppingItems = [];
let shoppingPendingItemIds = new Set();
let shoppingAddPending = false;
let shoppingClearPending = false;
let shoppingCreatePendingCount = 0;
let syncInFlight = false;
let lastAutoSyncAt = 0;
let authRequired = false;
let forceMobileView = false;
let importedSourceImageUrl = "";
let panLockStartX = 0;
let panLockStartY = 0;
let initialRecipeFromQuery = "";

function isMobileView() {
  return forceMobileView || window.matchMedia("(max-width: 768px)").matches;
}

function applyViewMode() {
  document.body.classList.toggle("force-mobile", forceMobileView);
  const viewBtn = document.getElementById("btn-view-mode");
  if (viewBtn) {
    viewBtn.textContent = forceMobileView ? "Desktop View" : "Mobile View";
    viewBtn.setAttribute("aria-pressed", forceMobileView ? "true" : "false");
  }
}

function loadViewModePreference() {
  try {
    forceMobileView = localStorage.getItem("recipes:view-mode") === "mobile";
  } catch (_) {
    forceMobileView = false;
  }
  applyViewMode();
}

function toggleViewMode() {
  forceMobileView = !forceMobileView;
  try {
    localStorage.setItem("recipes:view-mode", forceMobileView ? "mobile" : "auto");
  } catch (_) {}
  applyViewMode();

  closeMobileSidebar();
  closeMobileRecipeMenu();
  if (document.getElementById("recipe-detail").classList.contains("hidden")) {
    renderFromSearch();
    return;
  }
  if (currentRecipe) {
    openRecipe(currentRecipe);
  }
}

async function api(url, options={}) {
  const { skipLoading, loadingMessage, forceNetwork, ...fetchOptions } = options;
  fetchOptions.credentials = "include";
  if (forceNetwork) {
    fetchOptions.cache = "no-store";
    const headers = new Headers(fetchOptions.headers || {});
    headers.set("Cache-Control", "no-cache");
    headers.set("Pragma", "no-cache");
    fetchOptions.headers = headers;
  }

  if (!skipLoading) beginLoading(loadingMessage || "Loading...");
  try {
    const res = await fetch(url, fetchOptions);
    const isAuthRoute = url.includes("/api/login") || url.includes("/api/auth-check");
    if (res.status === 401 && !isAuthRoute) {
      showLoginOverlay();
    }
    return res;
  } finally {
    if (!skipLoading) endLoading();
  }
}

function showLoginOverlay(message = "") {
  authRequired = true;
  const overlay = document.getElementById("auth-overlay");
  const error = document.getElementById("login-error");
  const user = document.getElementById("login-username");
  const pass = document.getElementById("login-password");
  if (error) {
    if (message) {
      error.textContent = message;
      error.classList.remove("hidden");
    } else {
      error.textContent = "";
      error.classList.add("hidden");
    }
  }
  overlay.classList.remove("hidden");
  overlay.setAttribute("aria-hidden", "false");
  if (user) user.value = "";
  if (pass) pass.value = "";
  setTimeout(() => user?.focus(), 0);
}

function hideLoginOverlay() {
  authRequired = false;
  const overlay = document.getElementById("auth-overlay");
  overlay.classList.add("hidden");
  overlay.setAttribute("aria-hidden", "true");
}

async function checkAuth() {
  try {
    const res = await fetch(`${API}/auth-check`, { credentials: "include", cache: "no-store" });
    if (!res.ok) return false;
    const payload = await res.json();
    return Boolean(payload?.authenticated);
  } catch (_) {
    return false;
  }
}

async function submitLogin(event) {
  event.preventDefault();
  const submit = document.getElementById("login-submit");
  const error = document.getElementById("login-error");
  const username = document.getElementById("login-username").value.trim();
  const password = document.getElementById("login-password").value;
  if (error) {
    error.textContent = "";
    error.classList.add("hidden");
  }
  submit.disabled = true;
  try {
    const body = new URLSearchParams();
    body.set("username", username);
    body.set("password", password);
    const res = await fetch(`${API}/login`, {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString(),
      cache: "no-store"
    });
    if (!res.ok) {
      if (res.status === 401) {
        showLoginOverlay("Invalid username or password.");
      } else if (res.status >= 500) {
        showLoginOverlay("Server unavailable. Please try again in a moment.");
      } else {
        showLoginOverlay("Login failed. Please try again.");
      }
      return;
    }
    hideLoginOverlay();
    beginLoading("Loading recipes...");
    try {
      await loadRecipes({ forceNetwork: true });
      await loadShoppingList();
    } finally {
      endLoading();
    }
  } catch (_) {
    showLoginOverlay("Login failed. Please try again.");
  } finally {
    submit.disabled = false;
  }
}

function beginLoading(message) {
  pendingRequests += 1;
  const overlay = document.getElementById("loading-overlay");
  const text = document.getElementById("loading-text");
  text.textContent = message || "Loading...";

  if (pendingRequests > 1) return;

  if (loadingTimer) clearTimeout(loadingTimer);
  loadingTimer = setTimeout(() => {
    overlay.classList.add("visible");
    document.body.style.cursor = "progress";
    loadingShownAt = Date.now();
    loadingTimer = null;
  }, 140);
}

function endLoading() {
  pendingRequests = Math.max(0, pendingRequests - 1);
  if (pendingRequests > 0) return;

  if (loadingTimer) {
    clearTimeout(loadingTimer);
    loadingTimer = null;
    return;
  }

  const overlay = document.getElementById("loading-overlay");
  const minVisibleMs = 220;
  const elapsed = Date.now() - loadingShownAt;
  const hide = () => {
    overlay.classList.remove("visible");
    document.body.style.cursor = "";
  };

  if (elapsed < minVisibleMs) {
    setTimeout(hide, minVisibleMs - elapsed);
  } else {
    hide();
  }
}

function recipeImageSrc(name, cover, thumb = false) {
  if (!cover) return DEFAULT_RECIPE_IMAGE;
  const params = new URLSearchParams({
    recipe: name,
    filename: cover,
  });
  if (thumb) params.set("thumb", "1");
  return `/api/photo?${params.toString()}`;
}

function getRecipeImages(recipe) {
  const images = Array.isArray(recipe?.images)
    ? recipe.images.filter(Boolean)
    : [];
  if (images.length) return [...new Set(images)];
  if (recipe?.cover) return [recipe.cover];
  return [];
}

function normalizeRecipeSummary(recipe) {
  const normalized = { ...(recipe || {}) };
  const images = getRecipeImages(normalized);
  normalized.images = images;
  if (!normalized.cover && images.length) normalized.cover = images[0];
  return normalized;
}

function setModalCoverFromSelect() {
  const select = document.getElementById("title-image-select");
  modalCover = (select?.value || "").trim();
}

function resetModalImageState() {
  modalImages = [];
  modalCover = "";
  renderModalImageManager();
}

function openModalImageManager(images, cover) {
  modalImages = [...new Set((images || []).filter(Boolean))];
  if (cover && modalImages.includes(cover)) modalCover = cover;
  else modalCover = modalImages[0] || "";
  renderModalImageManager();
}

function renderModalImageManager() {
  const manager = document.getElementById("modal-image-manager");
  const list = document.getElementById("modal-image-list");
  const select = document.getElementById("title-image-select");
  if (!manager || !list || !select) return;

  if (!modalImages.length) {
    manager.classList.add("hidden");
    list.innerHTML = "";
    select.innerHTML = "";
    return;
  }

  manager.classList.remove("hidden");
  const imageItems = modalImages.map((value) => {
    const pending = value.startsWith("__pending__:");
    const filename = pending ? value.slice("__pending__:".length) : value;
    return { key: value, filename, pending };
  });

  select.innerHTML = imageItems
    .map(({ filename, pending }) => `<option value=${JSON.stringify(filename)}>${pending ? `${filename} (new)` : filename}</option>`)
    .join("");
  const availableNames = imageItems.map((item) => item.filename);
  if (modalCover && availableNames.includes(modalCover)) {
    select.value = modalCover;
  } else {
    modalCover = availableNames[0];
    select.value = modalCover;
  }

  const recipeName = document.getElementById("recipe-original-name").value.trim() || document.getElementById("recipe-name").value.trim();
  list.innerHTML = imageItems.map(({ filename, pending }) => `
    <div class="modal-image-item">
      ${pending || !recipeName
        ? `<div class="modal-image-placeholder">NEW</div>`
        : `<img src="${recipeImageSrc(recipeName, filename, true)}" alt="${filename}" onerror="this.onerror=null;this.src='${DEFAULT_RECIPE_IMAGE}'>`
      }
      <div class="modal-image-meta">
        <span class="modal-image-name">${filename}</span>
        ${modalCover === filename ? `<span class="modal-image-badge">Title</span>` : ""}
      </div>
      ${pending ? `<span class="modal-image-pending">Uploads on save</span>` : `<button type="button" class="danger" onclick='removeModalExistingImage(${JSON.stringify(filename)})'>Delete</button>`}
    </div>
  `).join("");
}

function syncModalPendingUploads() {
  const input = document.getElementById("photo-input");
  if (!input) return;
  const pendingNames = Array.from(input.files || [])
    .map((file) => (file?.name || "").trim())
    .filter(Boolean);
  const existingOnly = modalImages.filter((filename) => !filename.startsWith("__pending__:"));
  const pending = pendingNames.map((filename) => `__pending__:${filename}`);
  const merged = [...existingOnly, ...pending];
  modalImages = [...new Set(merged)];
  if (modalCover) {
    const availableNames = modalImages.map((value) => (
      value.startsWith("__pending__:") ? value.slice("__pending__:".length) : value
    ));
    if (!availableNames.includes(modalCover)) {
      modalCover = availableNames[0] || "";
    }
  }
  renderModalImageManager();
}

function clearSearch() {
  const desktopSearch = document.getElementById("search");
  const mobileSearch = document.getElementById("search-mobile");
  if (desktopSearch) desktopSearch.value = "";
  if (mobileSearch) mobileSearch.value = "";
  renderFromSearch();
}

function refreshShoppingStatus() {
  const status = document.getElementById("shopping-status");
  if (!status) return;

  let text = "";
  if (shoppingAddPending || shoppingCreatePendingCount > 0) text = "Adding item...";
  else if (shoppingClearPending) text = "Clearing checked items...";
  else if (shoppingPendingItemIds.size > 0) text = "Updating item...";

  if (!text) {
    status.classList.add("hidden");
    status.textContent = "";
    return;
  }

  status.textContent = text;
  status.classList.remove("hidden");
}

function setShoppingAddPending(isPending) {
  shoppingAddPending = Boolean(isPending);
  const row = document.querySelector(".shopping-list-input-row");
  const input = document.getElementById("shopping-item-input");
  const button = row ? row.querySelector("button") : null;

  if (row) row.classList.toggle("is-pending", shoppingAddPending);
  if (input) input.disabled = shoppingAddPending;
  if (button) {
    button.disabled = shoppingAddPending;
    button.textContent = shoppingAddPending ? "…" : "+";
    button.setAttribute("aria-busy", shoppingAddPending ? "true" : "false");
  }
  refreshShoppingStatus();
}

function setShoppingClearPending(isPending) {
  shoppingClearPending = Boolean(isPending);
  const button = document.querySelector(".shopping-clear-btn");
  if (!button) return;
  button.disabled = shoppingClearPending;
  button.classList.toggle("is-pending", shoppingClearPending);
  button.textContent = shoppingClearPending ? "Clearing..." : "Clear Checked";
  refreshShoppingStatus();
}

function setShoppingItemPending(itemId, isPending) {
  if (!itemId) return;
  if (isPending) shoppingPendingItemIds.add(itemId);
  else shoppingPendingItemIds.delete(itemId);
  refreshShoppingStatus();
  renderShoppingList();
}

function renderShoppingList() {
  const root = document.getElementById("shopping-list");
  const empty = document.getElementById("shopping-list-empty");
  if (!root || !empty) return;
  root.innerHTML = "";

  if (!shoppingItems.length) {
    empty.classList.remove("hidden");
    return;
  }
  empty.classList.add("hidden");

  const orderedItems = [...shoppingItems].sort((a, b) => Number(Boolean(a.checked)) - Number(Boolean(b.checked)));
  orderedItems.forEach((item) => {
    const isPending = shoppingPendingItemIds.has(item.id);
    const row = document.createElement("div");
    row.className = `shopping-item ${item.checked ? "is-checked" : ""} ${isPending ? "is-pending" : ""}`;
    if (isPending) row.setAttribute("aria-busy", "true");

    const check = document.createElement("input");
    check.type = "checkbox";
    check.checked = Boolean(item.checked);
    check.disabled = isPending;
    check.onchange = () => toggleShoppingItem(item.id);

    const text = document.createElement("button");
    text.type = "button";
    text.className = "shopping-item-text";
    text.textContent = item.text;
    text.disabled = isPending;
    text.onclick = () => toggleShoppingItem(item.id);

    const editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.className = "shopping-item-edit";
    editBtn.textContent = "✏️";
    editBtn.title = "Edit item";
    editBtn.disabled = isPending;
    editBtn.onclick = () => editShoppingItem(item.id, item.text);

    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "shopping-item-delete";
    delBtn.textContent = "🗑";
    delBtn.title = "Delete item";
    delBtn.disabled = isPending;
    delBtn.onclick = () => deleteShoppingItem(item.id);

    row.appendChild(check);
    row.appendChild(text);
    row.appendChild(editBtn);
    row.appendChild(delBtn);
    root.appendChild(row);
  });
}

async function loadShoppingList(skipLoading = true) {
  const res = await api(`${API}/shopping-list`, { skipLoading });
  if (!res.ok) {
    showToast("Could not load shopping list", "error");
    return;
  }
  const payload = await res.json();
  shoppingItems = Array.isArray(payload?.items) ? payload.items : [];
  renderShoppingList();
}

async function createShoppingListItem(text, { showSuccess = false } = {}) {
  const cleanText = String(text || "").trim();
  if (!cleanText) return false;
  shoppingCreatePendingCount += 1;
  refreshShoppingStatus();
  try {
    const res = await api(`${API}/shopping-list/items`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: cleanText }),
      skipLoading: true,
    });
    if (!res.ok) {
      showToast("Could not add item", "error");
      return false;
    }
    await loadShoppingList(true);
    if (showSuccess) showToast("Added to shopping list", "success");
    return true;
  } finally {
    shoppingCreatePendingCount = Math.max(0, shoppingCreatePendingCount - 1);
    refreshShoppingStatus();
  }
}

async function addShoppingItem() {
  if (shoppingAddPending) return;
  const input = document.getElementById("shopping-item-input");
  const text = (input?.value || "").trim();
  if (!text) return;

  setShoppingAddPending(true);
  try {
    const ok = await createShoppingListItem(text);
    if (!ok) return;
    if (input) input.value = "";
  } finally {
    setShoppingAddPending(false);
  }
}

async function toggleShoppingItem(itemId) {
  if (!itemId || shoppingPendingItemIds.has(itemId)) return;
  setShoppingItemPending(itemId, true);
  try {
    const res = await api(`${API}/shopping-list/items/${encodeURIComponent(itemId)}/toggle`, {
      method: "POST",
      skipLoading: true,
    });
    if (!res.ok) {

function applyBulkTagSuggestion(tag) {
  const input = document.getElementById("bulk-tags-input");
  if (!input) return;
  const raw = input.value;
  const nextTag = `${tag} `;
  if (/[\s,]$/.test(raw) || raw.length === 0) {
    input.value = `${raw}${nextTag}`;
  } else {
    input.value = raw.replace(/[^\s,]*$/, nextTag);
  }
  input.focus();
  renderBulkTagSuggestions();
}

function renderBulkTagSuggestions() {
  const box = document.getElementById("bulk-tag-suggestions");
  const input = document.getElementById("bulk-tags-input");
  if (!box || !input) return;
  const raw = input.value.trimEnd();
  const { currentToken, existingTokens } = getTagInputState(raw);
  const existing = new Set(existingTokens);

  const candidates = [...tagPopularity.entries()]
    .filter(([tag]) => !existing.has(tag))
    .filter(([tag]) => !currentToken || tag.startsWith(currentToken))
    .sort((a, b) => (b[1] - a[1]) || a[0].localeCompare(b[0]))
    .slice(0, 7);

  if (!candidates.length) {
    box.innerHTML = "";
    box.classList.add("hidden");
    return;
  }

  box.innerHTML = "";
  candidates.forEach(([tag, count]) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tag-suggestion-item";
    btn.innerHTML = `<span>${tag}</span><span class="tag-suggestion-count">${count}</span>`;
    btn.onclick = () => applyBulkTagSuggestion(tag);
    box.appendChild(btn);
  });
  box.classList.remove("hidden");
}

function bindTap(element, handler) {
  if ("PointerEvent" in window) {
    element.addEventListener("pointerup", (event) => {
      // Ignore right/middle clicks on desktop pointer devices.
      if (event.button && event.button !== 0) return;
      handler(event);
    });
    return;
  }

  element.addEventListener("click", (event) => {
    handler(event);
  });
}

function triggerHaptic() {

  }

function setupHapticFeedback() {
  const resolveTapTarget = (event) => {
    const raw = event.target;
    const el = raw instanceof Element ? raw : raw?.parentElement;
    if (!el) return null;
    return el.closest("button, .recipe-card, .tag-item span, .tag-delete");
  };

  document.addEventListener("pointerdown", (event) => {
    const target = resolveTapTarget(event);
    if (!target) return;
    target.classList.add("tap-press");
  });

  document.addEventListener("pointerup", (event) => {
    const target = resolveTapTarget(event);
    if (!target) return;
    target.classList.remove("tap-press");
  });

  document.addEventListener("click", (event) => {
    const target = resolveTapTarget(event);
    if (!target) return;
    triggerHaptic();
  });
}

function setupMobilePanLock() {
  document.addEventListener("touchstart", (event) => {
    if (!event.touches || event.touches.length !== 1) return;
    panLockStartX = event.touches[0].clientX;
    panLockStartY = event.touches[0].clientY;
  }, { passive: true });

  document.addEventListener("touchmove", (event) => {
    if (!event.touches || event.touches.length !== 1) return;
    if (!isMobileView()) return;
    const x = event.touches[0].clientX;
    const y = event.touches[0].clientY;
    const dx = Math.abs(x - panLockStartX);
    const dy = Math.abs(y - panLockStartY);
    if (dx > dy + 2) {
      event.preventDefault();
    }
  }, { passive: false });
}

async function loadRecipes(options = {}) {
  const { forceNetwork = false } = options;
  showRecipeSkeleton();
  const firstPage = await fetchRecipePage(0, true, forceNetwork);
  if (!firstPage) {
    showToast("Could not load recipes", "error");
    hideSplash();
    return;
  }

  allRecipes = firstPage.items;
  rebuildTagPopularity();
  renderFromSearch();
  renderTags();

  if (firstPage.nextOffset !== null) {
    loadRemainingRecipePages(firstPage.nextOffset, forceNetwork);
  }
  hideSplash();
}

async function fetchRecipePage(offset, skipLoading = true, forceNetwork = false) {
  const baseUrl = new URL(`${API}/recipes`, window.location.origin);
  baseUrl.searchParams.set("offset", String(offset));
  baseUrl.searchParams.set("limit", String(RECIPE_PAGE_SIZE));
  if (forceNetwork) {
    baseUrl.searchParams.set("_ts", `${Date.now()}-${offset}`);
  }
  const res = await api(`${baseUrl.pathname}${baseUrl.search}`, { skipLoading, forceNetwork });
  if (!res.ok) return null;

  const items = (await res.json()).map(normalizeRecipeSummary);
  const nextOffsetHeader = res.headers.get("X-Next-Offset");
  const nextOffset = nextOffsetHeader === null || nextOffsetHeader === ""
    ? null
    : Number(nextOffsetHeader);
  return { items, nextOffset };
}

async function refreshRecipesCache(forceNetwork = false) {
  const firstPage = await fetchRecipePage(0, true, forceNetwork);
  if (!firstPage) return false;

  allRecipes = firstPage.items;
  let nextOffset = firstPage.nextOffset;
  while (nextOffset !== null) {
    const page = await fetchRecipePage(nextOffset, true, forceNetwork);
    if (!page) break;
    mergeRecipes(page.items);
    nextOffset = page.nextOffset;
  }

  rebuildTagPopularity();
  renderTags();
  return true;
}

async function manualRefreshRecipes() {
  if (authRequired) return;
  if (syncInFlight) return;
  syncInFlight = true;
  beginLoading("Refreshing recipes...");
  try {
    const ok = await refreshRecipesCache(true);
    if (!ok) {
      showToast("Could not refresh recipes", "error");
      return;
    }
    renderFromSearch();
    showToast("Recipes synced", "success");
  } finally {
    syncInFlight = false;
    endLoading();
  }
}

function mergeRecipes(items) {
  const byName = new Map(allRecipes.map(r => [r.name, r]));
  items.forEach(item => byName.set(item.name, item));
  allRecipes = Array.from(byName.values()).sort((a, b) => a.name.localeCompare(b.name));
  rebuildTagPopularity();
}

function rebuildTagPopularity() {
  const counts = new Map();
  allRecipes.forEach((recipe) => {
    (recipe.tags || []).forEach((tag) => {
      counts.set(tag, (counts.get(tag) || 0) + 1);
    });
  });
  tagPopularity = counts;
}

function getTagInputState(rawValue) {
  const endsWithSeparator = /[\s,]$/.test(rawValue);
  const tokens = rawValue
    .split(/[,\s]+/)
    .map((t) => t.trim().toLowerCase())
    .filter(Boolean);
  if (endsWithSeparator) {
    return { currentToken: "", existingTokens: tokens };
  }
  const currentToken = tokens.pop() || "";
  return { currentToken, existingTokens: tokens };
}

function hideTagSuggestions() {
  const box = document.getElementById("tag-suggestions");
  box.innerHTML = "";
  box.classList.add("hidden");
}

function applyTagSuggestion(tag) {
  const input = document.getElementById("recipe-tags");
  const raw = input.value;
  const nextTag = `${tag} `;
  if (/[\s,]$/.test(raw) || raw.length === 0) {
    input.value = `${raw}${nextTag}`;
  } else {
    input.value = raw.replace(/[^\s,]*$/, nextTag);
  }
  input.focus();
  renderTagSuggestions();
}

function renderTagSuggestions() {
  const box = document.getElementById("tag-suggestions");
  const input = document.getElementById("recipe-tags");
  const raw = input.value.trimEnd();
  const { currentToken, existingTokens } = getTagInputState(raw);
  const existing = new Set(existingTokens);

  const candidates = [...tagPopularity.entries()]
    .filter(([tag]) => !existing.has(tag))
    .filter(([tag]) => !currentToken || tag.startsWith(currentToken))
    .sort((a, b) => (b[1] - a[1]) || a[0].localeCompare(b[0]))
    .slice(0, 7);

  if (!candidates.length) {
    hideTagSuggestions();
    return;
  }

  box.innerHTML = "";
  candidates.forEach(([tag, count]) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tag-suggestion-item";
    btn.innerHTML = `<span>${tag}</span><span class="tag-suggestion-count">${count}</span>`;
    btn.onclick = () => applyTagSuggestion(tag);
    box.appendChild(btn);
  });
  box.classList.remove("hidden");
}

async function loadRemainingRecipePages(startOffset, forceNetwork = false) {
  let nextOffset = startOffset;
  while (nextOffset !== null) {
    const page = await fetchRecipePage(nextOffset, true, forceNetwork);
    if (!page) return;
    mergeRecipes(page.items);
    renderTags();
    if (document.getElementById("recipe-detail").classList.contains("hidden")) {
      renderFromSearch();
    }
    nextOffset = page.nextOffset;
  }
}

function renderFromSearch() {
  const mobileSearch = document.getElementById("search-mobile");
  const desktopSearch = document.getElementById("search");
  const q = isMobileView()
    ? (mobileSearch?.value || "").toLowerCase()
    : (desktopSearch?.value || "").toLowerCase();
  renderRecipes(allRecipes.filter(r => r.name.toLowerCase().includes(q)));
}

function parseCreatedAt(value) {
  const time = Date.parse(value || "");
  return Number.isFinite(time) ? time : null;
}

function sortRecipes(recipes) {
  const items = [...recipes];
  const byNameAsc = (a, b) => a.name.localeCompare(b.name);

  if (sortMode === "alpha-desc") {
    return items.sort((a, b) => b.name.localeCompare(a.name));
  }
  if (sortMode === "date-desc") {
    return items.sort((a, b) => {
      const aTime = parseCreatedAt(a.created_at);
      const bTime = parseCreatedAt(b.created_at);
      if (aTime === null && bTime === null) return byNameAsc(a, b);
      if (aTime === null) return 1;
      if (bTime === null) return -1;
      if (bTime !== aTime) return bTime - aTime;
      return byNameAsc(a, b);
    });
  }
  if (sortMode === "date-asc") {
    return items.sort((a, b) => {
      const aTime = parseCreatedAt(a.created_at);
      const bTime = parseCreatedAt(b.created_at);
      if (aTime === null && bTime === null) return byNameAsc(a, b);
      if (aTime === null) return 1;
      if (bTime === null) return -1;
      if (aTime !== bTime) return aTime - bTime;
      return byNameAsc(a, b);
    });
  }
  return items.sort(byNameAsc);
}

function renderRecipes(recipes) {
  const sortedRecipes = sortRecipes(recipes);
  visibleRecipes = sortedRecipes;
  document.body.classList.remove("mobile-recipe-open");
  document.getElementById("recipe-detail").classList.add("hidden");
  document.getElementById("grid-controls").style.display = "flex";
  document.getElementById("recipe-grid").classList.remove("hidden");

  const grid = document.getElementById("recipe-grid");
  grid.innerHTML = "";

  if (!sortedRecipes.length) {
    const hasLibrary = allRecipes.length > 0;
    grid.innerHTML = hasLibrary
      ? `
        <div class="empty-state">
          <h3>No matching recipes</h3>
          <p>Try a different search or clear your filters.</p>
          <div class="empty-actions">
            <button class="primary" onclick="clearSearch()">Clear Search</button>
            <button onclick="renderRecipes(allRecipes)">Show All</button>
          </div>
        </div>
      `
      : `
        <div class="empty-state">
          <h3>No recipes yet</h3>
          <p>Import your first recipe to start your library.</p>
          <div class="empty-actions">
            <button class="primary" onclick="openImport()">+ Import Recipe</button>
          </div>
        </div>
      `;
    return;
  }

  sortedRecipes.forEach(r => {
    const card = document.createElement("div");
    const selected = selectedRecipes.has(r.name);
    card.className = `recipe-card ${selectionMode ? "selectable" : ""} ${selected ? "is-selected" : ""}`;
    const isFallback = !r.cover;
    const chips = (r.tags || []).slice(0, 3).map(t => `<span class="tag-chip">${t}</span>`).join("");
    const extraTagCount = (r.tags || []).length - 3;

    card.innerHTML = `
      ${selectionMode ? `<div class="select-indicator">${selected ? "✓" : ""}</div>` : ""}
      <img class="${isFallback ? "is-fallback" : ""}" src="${recipeImageSrc(r.name, r.cover, true)}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='${DEFAULT_RECIPE_IMAGE}';this.classList.add('is-fallback')">
      <div class="recipe-title">${r.name}</div>
      <div class="recipe-card-meta">
        ${chips}
        ${extraTagCount > 0 ? `<span class="tag-chip">+${extraTagCount}</span>` : ""}
      </div>
    `;

    card.onclick = () => {
      if (selectionMode) {
        toggleRecipeSelection(r.name);
      } else {
        openRecipe(r.name);
      }
    };
    grid.appendChild(card);
  });
}

function renderTags() {
  const tagList = document.getElementById("tag-list");
  tagList.innerHTML = "";

  const tags = new Set();
  allRecipes.forEach(r => r.tags.forEach(t => tags.add(t)));

  const allBtn = document.createElement("button");
  allBtn.type = "button";
  allBtn.className = "tag-link-btn";
  allBtn.textContent = "All Recipes";
  bindTap(allBtn, () => {
    renderFromSearch();
    closeSidebarIfMobile();
  });
  tagList.appendChild(allBtn);

  [...tags].sort().forEach(tag => {
    const div = document.createElement("div");
    div.className = "tag-item";
    const name = document.createElement("button");
    name.type = "button";
    name.className = "tag-link-btn";
    name.textContent = tag;
    bindTap(name, () => filterTag(tag));

    const del = document.createElement("button");
    del.type = "button";
    del.className = "tag-delete";
    del.textContent = "🗑";
    bindTap(del, (e) => {
      e.stopPropagation();
      deleteTag(tag);
    });

    div.appendChild(name);
    div.appendChild(del);
    tagList.appendChild(div);
  });
}

function filterTag(tag) {
  renderRecipes(allRecipes.filter(r => r.tags.includes(tag)));
  closeSidebarIfMobile();
}

async function openRecipe(name) {
  if (selectionMode) return;
  currentRecipe = name;
  setActiveTab("recipes");
  closeSidebarIfMobile();
  beginLoading("Opening recipe...");

  try {
    const res = await api(`${API}/recipe?name=${encodeURIComponent(name)}`, { skipLoading: true });
    if (!res.ok) {
      showToast("Could not open recipe", "error");
      return;
    }

    let md = await res.text();

    // Remove Tags line
    md = md.replace(/^Tags:.*\n+/m, "");

    // Remove first markdown heading so title isn't duplicated
    md = md.replace(/^#+\s+.*\n?/, "");

    const recipe = allRecipes.find(r => r.name === name);
    let recipeImages = getRecipeImages(recipe);
    let coverImage = recipe?.cover && recipeImages.includes(recipe.cover) ? recipe.cover : (recipeImages[0] || null);
    const photosRes = await api(`${API}/recipe/photos?name=${encodeURIComponent(name)}`, { skipLoading: true });
    if (photosRes.ok) {
      const payload = await photosRes.json();
      const fetchedImages = Array.isArray(payload?.images) ? payload.images.filter(Boolean) : [];
      if (fetchedImages.length) {
        recipeImages = [...new Set(fetchedImages)];
        coverImage = payload?.cover && recipeImages.includes(payload.cover) ? payload.cover : recipeImages[0];
      }
    }
    const mobileView = isMobileView();

async function editRecipe(name) {
  const res = await api(`${API}/recipe?name=${encodeURIComponent(name)}`);
  if (!res.ok) {
    showToast("Could not open editor", "error");
    return;
  }
  const md = await res.text();
  const recipe = allRecipes.find(r => r.name === name);
  let editImages = getRecipeImages(recipe);
  let editCover = recipe?.cover || "";
  const photosRes = await api(`${API}/recipe/photos?name=${encodeURIComponent(name)}`, { skipLoading: true });
  if (photosRes.ok) {
    const payload = await photosRes.json();
    const fetchedImages = Array.isArray(payload?.images) ? payload.images.filter(Boolean) : [];
    if (fetchedImages.length) {
      editImages = [...new Set(fetchedImages)];
      editCover = payload?.cover && editImages.includes(payload.cover) ? payload.cover : editImages[0];
    }
  }

  document.getElementById("modal-title").textContent = "Edit Recipe";
  document.getElementById("recipe-original-name").value = name;
  document.getElementById("recipe-name").value = name;
  document.getElementById("recipe-tags").value = (recipe?.tags || []).join(" ");
  renderTagSuggestions();
  document.getElementById("recipe-markdown").value = md.replace(/^Tags:.*\n+/m, "");
  importedSourceImageUrl = "";
  openModalImageManager(editImages, editCover);
  document.getElementById("photo-input").value = "";
  document.getElementById("modal").classList.remove("hidden");
}

async function saveRecipe() {
  const name = document.getElementById("recipe-name").value.trim();
  const originalName = document.getElementById("recipe-original-name").value.trim();
  const markdown = document.getElementById("recipe-markdown").value;
  const tags = document.getElementById("recipe-tags").value.trim();
  const photoInput = document.getElementById("photo-input");
  const photos = Array.from(photoInput.files || []);

  if (!name || !markdown) {
    showToast("Name and markdown required", "error");
    return;
  }

  const form = new FormData();
  form.append("name", name);
  form.append("markdown", markdown);
  form.append("tags", tags);
  if (originalName) form.append("original_name", originalName);
  if (modalCover) form.append("cover", modalCover);
  if (importedSourceImageUrl) form.append("source_image_url", importedSourceImageUrl);
  photos.forEach((photo) => form.append("photos", photo));

  const res = await api(`${API}/recipes`, {
    method:"POST",
    body:form,
    loadingMessage: "Saving recipe..."
  });
  if (!res.ok) { showToast("Save failed", "error"); return; }

  document.getElementById("recipe-original-name").value = "";
  closeModal();
  const refreshed = await refreshRecipesCache();
  if (!refreshed) {
    showToast("Recipe saved, but list refresh failed", "error");
  }
  await openRecipe(name);
  showToast("Recipe saved", "success");
}

async function deleteRecipe(name) {

  const res = await api(`${API}/recipe?name=${encodeURIComponent(name)}`, {

async function importSourceFile(file) {
  if (!file) return;

  const form = new FormData();
  form.append("source_file", file);

  const res = await api(`${API}/import/convert`, {
    method: "POST",
    body: form,
    loadingMessage: "Converting file..."
  });

  if (!res.ok) {
    let message = "File conversion failed";
    try {
      const payload = await res.json();
      if (payload?.detail) message = payload.detail;
    } catch (_) {}
    showToast(message, "error");
    return;
  }

  const payload = await res.json();
  const nameInput = document.getElementById("recipe-name");
  const markdownInput = document.getElementById("recipe-markdown");
  const existingName = nameInput.value.trim();

  if (!existingName && payload.name) {
    nameInput.value = payload.name;
  }
  importedSourceImageUrl = "";
  markdownInput.value = payload.markdown || "";
  showToast("File converted to markdown", "success");
}

async function importFromUrl() {
  const urlInput = document.getElementById("source-url");
  const markdownInput = document.getElementById("recipe-markdown");
  const nameInput = document.getElementById("recipe-name");
  const sourceUrl = (urlInput?.value || "").trim();
  if (!sourceUrl) {
    showToast("Enter a URL first", "error");
    return;
  }

  const form = new FormData();
  form.append("url", sourceUrl);
  const notes = (markdownInput?.value || "").trim();
  if (notes) form.append("notes", notes);

  const res = await api(`${API}/import/url`, {
    method: "POST",
    body: form,
    loadingMessage: "Importing from URL..."
  });

  if (!res.ok) {
    let message = "URL import failed";
    try {
      const payload = await res.json();
      if (payload?.detail) message = payload.detail;
    } catch (_) {}
    showToast(message, "error");
    return;
  }

  const payload = await res.json();
  if (!nameInput.value.trim() && payload.name) {
    nameInput.value = payload.name;
  }
  importedSourceImageUrl = (payload.image_url || "").trim();
  let nextMarkdown = payload.markdown || "";
  const sourceLine = `Source video: [Open link](${sourceUrl})`;
  if (sourceUrl && !nextMarkdown.includes(sourceUrl)) {
    nextMarkdown = `${nextMarkdown.trimEnd()}\n\n---\n\n${sourceLine}\n`;
  }
  markdownInput.value = nextMarkdown;
  showToast(importedSourceImageUrl ? "URL imported with video screenshot" : "URL imported", "success");
}

function wrapInstructionsSection() {
  const markdown = document.querySelector("#recipe-detail .markdown-content");
  if (!markdown) return;
  if (markdown.querySelector(".instructions-section")) return;

  const children = [...markdown.children];
  let startIndex = -1;

  for (let i = 0; i < children.length; i += 1) {
    const el = children[i];
    if (!/^H[23]$/.test(el.tagName)) continue;
    const title = (el.textContent || "").trim().toLowerCase();
    if (title === "instructions" || title === "directions") {
      startIndex = i;
      break;
    }
  }
  if (startIndex === -1) return;

  const section = document.createElement("div");
  section.className = "instructions-section";
  const startNode = children[startIndex];
  markdown.insertBefore(section, startNode);

  let idx = startIndex;
  while (idx < children.length) {
    const node = children[idx];
    if (idx > startIndex && /^H2$/.test(node.tagName)) break;
    section.appendChild(node);
    idx += 1;
  }
}

function parseQuantityToken(token) {
  const raw = (token || "").trim();
  if (!raw) return null;
  const fractionMap = {
    "¼": "1/4",
    "½": "1/2",
    "¾": "3/4",
    "⅐": "1/7",
    "⅑": "1/9",
    "⅒": "1/10",
    "⅓": "1/3",
    "⅔": "2/3",
    "⅕": "1/5",
    "⅖": "2/5",
    "⅗": "3/5",
    "⅘": "4/5",
    "⅙": "1/6",
    "⅚": "5/6",
    "⅛": "1/8",
    "⅜": "3/8",
    "⅝": "5/8",
    "⅞": "7/8"
  };

  let normalized = raw
    .replace(/(\d)([¼½¾⅐⅑⅒⅓⅔⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞])/g, "$1 $2")
    .replace(/[¼½¾⅐⅑⅒⅓⅔⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞]/g, (ch) => fractionMap[ch] || ch)
    .replace(/\s+/g, " ")
    .trim();

  if (/^\d+\s+\d+\/\d+$/.test(normalized)) {
    const [whole, frac] = normalized.split(/\s+/);
    const [num, den] = frac.split("/").map(Number);
    if (!Number.isFinite(num) || !Number.isFinite(den) || den === 0) return null;
    return Number(whole) + (num / den);
  }
  if (/^\d+\/\d+$/.test(normalized)) {
    const [num, den] = normalized.split("/").map(Number);
    if (!Number.isFinite(num) || !Number.isFinite(den) || den === 0) return null;
    return num / den;
  }
  const value = Number(normalized);
  return Number.isFinite(value) ? value : null;
}

function gcd(a, b) {
  let x = Math.abs(a);
  let y = Math.abs(b);
  while (y) [x, y] = [y, x % y];
  return x || 1;
}

function formatScaledQuantity(value) {
  if (!Number.isFinite(value)) return "";
  if (Math.abs(value - Math.round(value)) < 1e-6) return String(Math.round(value));

  const rounded = Math.round(value * 8) / 8;
  if (rounded <= 0) return value.toFixed(2).replace(/\.?0+$/, "");
  const whole = Math.floor(rounded + 1e-8);
  let numer = Math.round((rounded - whole) * 8);
  let denom = 8;

  if (numer === 0) return String(whole);
  const div = gcd(numer, denom);
  numer /= div;
  denom /= div;

  if (whole === 0) return `${numer}/${denom}`;
  return `${whole} ${numer}/${denom}`;
}

const QUANTITY_TOKEN_PATTERN = "(?:\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:\\.\\d+)?|[¼½¾⅐⅑⅒⅓⅔⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞]|\\d+[¼½¾⅐⅑⅒⅓⅔⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞])";
const LINE_PREFIX_PATTERN = "(\\s*(?:[-*•]\\s+)?)";

function extractLeadingQuantity(line) {
  const rangeRegex = new RegExp(`^${LINE_PREFIX_PATTERN}(${QUANTITY_TOKEN_PATTERN})(\\s*(?:-|to)\\s*)(${QUANTITY_TOKEN_PATTERN})(\\s+.+)?$`, "i");
  const rangeMatch = line.match(rangeRegex);
  if (rangeMatch) {
    return {
      kind: "range",
      prefix: rangeMatch[1],
      first: rangeMatch[2],
      separator: rangeMatch[3],
      second: rangeMatch[4],
      suffix: rangeMatch[5] || ""
    };
  }

  const singleRegex = new RegExp(`^${LINE_PREFIX_PATTERN}(${QUANTITY_TOKEN_PATTERN})(\\s+.+)?$`);
  const singleMatch = line.match(singleRegex);
  if (singleMatch) {
    return {
      kind: "single",
      prefix: singleMatch[1],
      first: singleMatch[2],
      suffix: singleMatch[3] || ""
    };
  }

  return null;
}

function hasScalableQuantity(line) {
  const parts = String(line || "").split(/\r?\n/);
  for (const part of parts) {
    const parsed = extractLeadingQuantity(part.trim());
    if (!parsed) continue;
    if (parsed.kind === "range") {
      if (parseQuantityToken(parsed.first) !== null && parseQuantityToken(parsed.second) !== null) return true;
      continue;
    }
    if (parseQuantityToken(parsed.first) !== null) return true;
  }
  return false;
}

function scaleIngredientLine(line, factor) {
  const parsed = extractLeadingQuantity(line);
  if (!parsed) return line;

  if (parsed.kind === "range") {
    const low = parseQuantityToken(parsed.first);
    const high = parseQuantityToken(parsed.second);
    if (low === null || high === null) return line;
    return `${parsed.prefix}${formatScaledQuantity(low * factor)}${parsed.separator}${formatScaledQuantity(high * factor)}${parsed.suffix}`;
  }

  const amount = parseQuantityToken(parsed.first);
  if (amount === null) return line;
  return `${parsed.prefix}${formatScaledQuantity(amount * factor)}${parsed.suffix}`;
}

function scaleIngredientTextBlock(text, factor) {
  const source = String(text || "");
  return source
    .split(/\r?\n/)
    .map((line) => scaleIngredientLine(line, factor))
    .join("\n");
}

function ingredientIconForText(text) {
  const raw = String(text || "").toLowerCase();
  const normalized = raw
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
  if (!normalized) return "🍽️";

  const matches = (terms) => terms.some((term) => normalized.includes(term));
  if (matches(["beef", "steak", "ground beef", "brisket", "veal", "lamb", "pork", "bacon", "ham", "sausage", "turkey", "chicken"])) return "🍖";
  if (matches(["fish", "salmon", "tuna", "shrimp", "cod", "tilapia", "crab", "lobster"])) return "🐟";
  if (matches(["egg", "eggs"])) return "🥚";
  if (matches(["milk", "cream", "cheese", "butter", "yogurt", "mozzarella", "parmesan", "cheddar"])) return "🧀";
  if (matches(["flour", "bread", "rice", "pasta", "noodle", "oats", "quinoa", "tortilla"])) return "🌾";
  if (matches(["tomato", "pepper", "onion", "garlic", "carrot", "celery", "broccoli", "spinach", "lettuce", "zucchini", "cucumber", "potato", "mushroom", "corn"])) return "🥕";
  if (matches(["apple", "banana", "berry", "berries", "strawberry", "blueberry", "lemon", "lime", "orange", "avocado", "grape", "mango", "pineapple"])) return "🍎";
  if (matches(["sugar", "honey", "maple", "syrup", "vanilla", "cinnamon", "cocoa", "chocolate"])) return "🍯";
  if (matches(["salt", "pepper", "paprika", "cumin", "oregano", "thyme", "rosemary", "basil", "spice", "seasoning"])) return "🧂";
  if (matches(["oil", "olive oil", "canola", "vegetable oil", "sesame oil", "vinegar"])) return "🫒";
  if (matches(["water", "broth", "stock", "wine", "beer", "juice"])) return "🥣";
  return "🍽️";
}

function renderIngredientNode(node, lineText) {
  if (!node) return;
  const raw = String(lineText || "");
  const lines = raw
    .split(/\r?\n/)
    .map((line) => line.trim())
    .filter(Boolean);
  if (!lines.length) {
    node.textContent = lineText || "";
    return;
  }
  node.classList.add("ingredient-line");
  node.textContent = "";

  lines.forEach((line) => {
    const row = document.createElement("span");
    row.className = "ingredient-line-inner";

    const text = document.createElement("span");
    text.className = "ingredient-line-text";
    text.textContent = `${ingredientIconForText(line)} ${line}`;

    const addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "ingredient-add-btn";
    addBtn.title = "Add ingredient to shopping list";
    addBtn.setAttribute("aria-label", "Add ingredient to shopping list");
    addBtn.textContent = "+";

    addBtn.addEventListener("click", async (event) => {
      event.preventDefault();
      event.stopPropagation();
      if (addBtn.disabled) return;
      addBtn.disabled = true;
      addBtn.classList.add("is-pending");
      addBtn.textContent = "…";
      try {
        await createShoppingListItem(line, { showSuccess: true });
      } finally {
        addBtn.disabled = false;
        addBtn.classList.remove("is-pending");
        addBtn.textContent = "+";
      }
    });

    row.appendChild(addBtn);
    row.appendChild(text);
    node.appendChild(row);
  });
}

function findIngredientLineNodes(markdown) {
  const collectSectionLines = (startHeading) => {
    const lines = [];
    let node = startHeading?.nextElementSibling || null;
    while (node && !/^H[23]$/.test(node.tagName)) {
      if (node.tagName === "UL" || node.tagName === "OL") {
        lines.push(...node.querySelectorAll("li"));
      } else if (node.tagName === "P") {
        lines.push(node);
      }
      node = node.nextElementSibling;
    }
    return lines;
  };

  const headings = [...markdown.querySelectorAll("h2, h3")];
  let heading = null;
  for (const h of headings) {
    const title = (h.textContent || "").trim().toLowerCase().replace(/[:\s]+$/g, "");
    if (title === "ingredients" || title === "ingredient") {
      heading = h;
      break;
    }
  }
  if (heading) {
    const sectionLines = collectSectionLines(heading);
    if (sectionLines.length) return sectionLines;
  }

  // Fallback for recipes without an "Ingredients" heading:
  // gather lines before steps/instructions and keep only quantity-led lines.
  const isStepsHeading = (text) => {
    const t = (text || "").trim().toLowerCase().replace(/[:\s]+$/g, "");
    return t === "steps" || t === "step" || t === "instructions" || t === "directions" || t === "method";
  };

  let stopAt = null;
  for (const h of headings) {
    if (isStepsHeading(h.textContent)) {
      stopAt = h;
      break;
    }
  }

  const fallback = [];
  for (const node of [...markdown.children]) {
    if (stopAt && node === stopAt) break;
    if (node.tagName === "UL" || node.tagName === "OL") {
      fallback.push(...node.querySelectorAll("li"));
    } else if (node.tagName === "P") {
      fallback.push(node);
    }
  }

  return fallback.filter((node) => hasScalableQuantity((node.textContent || "").trim()));
}

function applyRecipeScale(factor) {
  const safeFactor = Math.max(0.25, factor || 1);
  recipeScaleFactor = safeFactor;
  const label = document.getElementById("recipe-scale-label");
  const mobileLabel = document.getElementById("recipe-scale-label-mobile");
  const input = document.getElementById("recipe-scale-input");
  const select = document.getElementById("recipe-scale-select");
  const mobileSelect = document.getElementById("recipe-scale-select-mobile");
  const formattedFactor = safeFactor.toFixed(2).replace(/\.?0+$/, "");
  if (label) {
    label.textContent = `${formattedFactor}x`;
  }
  if (mobileLabel) {
    mobileLabel.textContent = `${formattedFactor}x`;
  }

  if (input && document.activeElement !== input) {
    input.value = formattedFactor;
  }

  if (select && document.activeElement !== select) {
    const match = [...select.options].find((option) => option.value === formattedFactor);
    if (match) {
      select.value = match.value;
    }
  }

  if (mobileSelect && document.activeElement !== mobileSelect) {
    const match = [...mobileSelect.options].find((option) => option.value === formattedFactor);
    if (match) {
      mobileSelect.value = match.value;
    }
  }

  ingredientScaleNodes.forEach((node) => {
    const original = node.dataset.originalIngredientLine || node.textContent || "";
    const scaled = scaleIngredientTextBlock(original, safeFactor);
    renderIngredientNode(node, scaled);
  });
}

function setupRecipeScaling() {
  ingredientScaleNodes = [];
  recipeScaleFactor = 1;

  const detail = document.getElementById("recipe-detail");
  const markdown = detail?.querySelector(".markdown-content");
  const input = document.getElementById("recipe-scale-input");
  const select = document.getElementById("recipe-scale-select");
  const mobileSelect = document.getElementById("recipe-scale-select-mobile");
  const label = document.getElementById("recipe-scale-label");
  if (!markdown || (!input && !mobileSelect)) return;

  const lineNodes = findIngredientLineNodes(markdown)
    .filter((node) => !!(node.textContent || "").trim());

  lineNodes.forEach((node) => {
    node.dataset.originalIngredientLine = node.textContent;
    renderIngredientNode(node, node.dataset.originalIngredientLine);
  });
  ingredientScaleNodes = lineNodes;

  if (input) input.value = "1";
  if (select) select.value = "1";
  if (mobileSelect) mobileSelect.value = "1";
  if (label) label.textContent = "1x";
  if (input) {
    input.addEventListener("input", () => {
      const next = Number(input.value);
      if (!Number.isFinite(next) || next <= 0) return;
      applyRecipeScale(next);
    });
  }
  if (select) {
    select.addEventListener("change", () => {
      const next = Number(select.value);
      if (!Number.isFinite(next) || next <= 0) return;
      applyRecipeScale(next);
    });
  }
  if (mobileSelect) {
    mobileSelect.addEventListener("change", () => {
      const next = Number(mobileSelect.value);
      if (!Number.isFinite(next) || next <= 0) return;
      applyRecipeScale(next);
    });
  }

  applyRecipeScale(1);
}

function printRecipe() {
  computePrintScale();
  window.print();
}

function computePrintScale() {
  const detail = document.getElementById("recipe-detail");
  if (!detail || detail.classList.contains("hidden")) return;
  buildStructuredPrintLayout(detail);
}

function resetPrintScale() {
  const detail = document.getElementById("recipe-detail");
  if (!detail) return;
  const structured = detail.querySelector(".print-structured");
  if (structured) structured.remove();
  detail.classList.remove("print-layout-ready");
}

function buildStructuredPrintLayout(detail) {
  const old = detail.querySelector(".print-structured");
  if (old) old.remove();

  const titleEl = detail.querySelector(".detail-header h1");
  const markdown = detail.querySelector(".markdown-content");
  if (!titleEl || !markdown) return;

  const allNodes = [...markdown.children];
  if (!allNodes.length) return;

  const isStepsHeading = (text) => {
    const t = (text || "").trim().toLowerCase().replace(/[:\s]+$/g, "");
    return t === "steps" || t === "step" || t === "instructions" || t === "directions" || t === "method";
  };

  let splitIndex = -1;
  for (let i = 0; i < allNodes.length; i += 1) {
    const node = allNodes[i];
    if (!/^H[23]$/.test(node.tagName)) continue;
    if (isStepsHeading(node.textContent)) {
      splitIndex = i;
      break;
    }
  }
  if (splitIndex === -1) splitIndex = allNodes.length;

  const topNodes = allNodes.slice(0, splitIndex);
  const stepsNodes = allNodes.slice(splitIndex);
  const printRoot = document.createElement("div");
  printRoot.className = "print-structured";

  const top = document.createElement("section");
  top.className = "print-top";
  const heading = document.createElement("h1");
  heading.textContent = titleEl.textContent.trim();
  top.appendChild(heading);

  const photo = detail.querySelector(".detail-image");
  const photoFilename = (photo?.getAttribute("data-filename") || "").trim();
  if (photo && photo.getAttribute("src") && photoFilename) {
    const img = document.createElement("img");
    img.className = "print-top-photo";
    img.src = photo.getAttribute("src");
    img.alt = heading.textContent;
    top.appendChild(img);
  }

  const topContent = document.createElement("div");
  topContent.className = "print-top-content";
  topNodes.forEach((node) => topContent.appendChild(node.cloneNode(true)));
  top.appendChild(topContent);

  printRoot.appendChild(top);

  if (stepsNodes.length) {
    const bottom = document.createElement("section");
    bottom.className = "print-steps";
    const bottomTitle = document.createElement("h2");
    bottomTitle.textContent = /^H[23]$/.test(stepsNodes[0].tagName)
      ? (stepsNodes[0].textContent || "Steps").trim()
      : "Steps";
    bottom.appendChild(bottomTitle);

    const grid = document.createElement("div");
    grid.className = "print-steps-grid";
    const left = document.createElement("div");
    left.className = "print-steps-col";
    const right = document.createElement("div");
    right.className = "print-steps-col";

    const flowNodes = /^H[23]$/.test(stepsNodes[0].tagName) ? stepsNodes.slice(1) : stepsNodes;
    const getWeight = (node) => {
      const txt = (node.textContent || "").trim().length;
      if (node.tagName === "UL" || node.tagName === "OL") return txt + 80;
      if (node.tagName === "P") return txt + 24;
      if (/^H[23]$/.test(node.tagName)) return txt + 30;
      return txt + 16;
    };

    // Build step blocks so we split at whole-step boundaries.
    const blocks = [];
    let currentBlock = [];
    flowNodes.forEach((node) => {
      const startsNewBlock = /^H[23]$/.test(node.tagName) && currentBlock.length > 0;
      if (startsNewBlock) {
        blocks.push(currentBlock);
        currentBlock = [node];
      } else {
        currentBlock.push(node);
      }
    });
    if (currentBlock.length) blocks.push(currentBlock);

    const blockWeights = blocks.map((block) => block.reduce((sum, n) => sum + getWeight(n), 0));
    const totalWeight = blockWeights.reduce((sum, w) => sum + w, 0);
    let splitAt = blocks.length;

    if (blocks.length > 1) {
      // Find split closest to 50/50 while keeping both columns populated.
      let running = 0;
      let bestDiff = Number.POSITIVE_INFINITY;
      let bestIndex = 1;
      for (let i = 1; i < blocks.length; i += 1) {
        running += blockWeights[i - 1];
        const diff = Math.abs((totalWeight / 2) - running);
        if (diff < bestDiff) {
          bestDiff = diff;
          bestIndex = i;
        }
      }
      splitAt = bestIndex;
    }

    blocks.forEach((block, blockIndex) => {
      const wrapper = document.createElement("div");
      wrapper.className = "print-step-block";
      block.forEach((node) => wrapper.appendChild(node.cloneNode(true)));
      if (blockIndex < splitAt) {
        left.appendChild(wrapper);
      } else {
        right.appendChild(wrapper);
      }
    });

    grid.appendChild(left);
    grid.appendChild(right);
    bottom.appendChild(grid);
    printRoot.appendChild(bottom);
  }

  detail.appendChild(printRoot);
  detail.classList.add("print-layout-ready");
}

async function disableServiceWorkers() {
  if (!("serviceWorker" in navigator)) return;
  try {
    const registrations = await navigator.serviceWorker.getRegistrations();
    for (const registration of registrations) {
      await registration.unregister();
    }
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map((key) => caches.delete(key)));
    }
  } catch (err) {
    console.error("Service worker cleanup failed:", err);
  }
}

const desktopSearchInput = document.getElementById("search");
const mobileSearchInput = document.getElementById("search-mobile");

desktopSearchInput.addEventListener("input", (e) => {
  if (mobileSearchInput && mobileSearchInput.value !== e.target.value) {
    mobileSearchInput.value = e.target.value;
  }
  setActiveTab("search");
  const q = e.target.value.toLowerCase();
  renderRecipes(allRecipes.filter((r) => r.name.toLowerCase().includes(q)));
});

if (mobileSearchInput) {
  mobileSearchInput.addEventListener("input", (e) => {
    if (desktopSearchInput && desktopSearchInput.value !== e.target.value) {
      desktopSearchInput.value = e.target.value;
    }
    setActiveTab("search");
    const q = e.target.value.toLowerCase();
    renderRecipes(allRecipes.filter((r) => r.name.toLowerCase().includes(q)));
  });
}

document.getElementById("sort-mode").addEventListener("change", (e) => {
  sortMode = e.target.value || "alpha-asc";
  renderFromSearch();
});

document.getElementById("recipe-tags").addEventListener("input", renderTagSuggestions);
document.getElementById("recipe-tags").addEventListener("focus", renderTagSuggestions);
document.getElementById("recipe-tags").addEventListener("blur", () => {
  setTimeout(hideTagSuggestions, 120);
});
document.getElementById("bulk-tags-input").addEventListener("input", renderBulkTagSuggestions);
document.getElementById("bulk-tags-input").addEventListener("focus", renderBulkTagSuggestions);
document.getElementById("bulk-tags-input").addEventListener("blur", () => {
  setTimeout(() => {
    const box = document.getElementById("bulk-tag-suggestions");
    if (!box) return;
    box.classList.add("hidden");
  }, 120);
});

  importSourceFile(file);
});
document.getElementById("photo-input").addEventListener("change", () => {

});
document.getElementById("shopping-item-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    addShoppingItem();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    closeImageLightbox();
    closeMobileRecipeMenu();
    closeBulkTagModal();
  }
});

document.addEventListener("click", () => {
  closeMobileRecipeMenu();
});

/* Close mobile sidebar if rotating to desktop */
window.addEventListener("resize", () => {
  if (!isMobileView()) {
    closeMobileSidebar();
  }
});

window.addEventListener("beforeprint", computePrintScale);
window.addEventListener("afterprint", resetPrintScale);
window.addEventListener("online", () => {
  void autoRefreshRecipes();
});
window.addEventListener("focus", () => {
  void autoRefreshRecipes();
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  void autoRefreshRecipes();
});

async function autoRefreshRecipes() {
  const now = Date.now();
  if (authRequired || syncInFlight || now - lastAutoSyncAt < 45000) return;
  lastAutoSyncAt = now;
  syncInFlight = true;
  try {
    const ok = await refreshRecipesCache(true);
    if (ok) renderFromSearch();
  } finally {
    syncInFlight = false;
  }
}

async function initApp() {
  disableServiceWorkers();
  try {
    const params = new URLSearchParams(window.location.search);
    initialRecipeFromQuery = (params.get("recipe") || "").trim();
  } catch (_) {
    initialRecipeFromQuery = "";
  }
  const authenticated = await checkAuth();
  if (!authenticated) {
    showLoginOverlay();
    hideSplash();
    return;
  }
  hideLoginOverlay();
  await loadRecipes({ forceNetwork: true });
  await loadShoppingList();
  if (initialRecipeFromQuery) {
    const targetName = initialRecipeFromQuery;
    initialRecipeFromQuery = "";
    if (allRecipes.some((recipe) => recipe.name === targetName)) {
      await openRecipe(targetName);
    }
  }
}

setGrid();
updateBulkToolbar();
setupHapticFeedback();
setupMobilePanLock();
loadViewModePreference();
void initApp();
setTimeout(hideSplash, 2800);
